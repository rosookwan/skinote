<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 접수 ② 약속 정하기 · 둘째 판 시안 V3</title>
<link rel="stylesheet" href="base.css">
<style>
  /* V3 새 접수 ② 약속 정하기(spec.md 3-5). 틀은 2-1 가(접수증형). 왼쪽 묶음 넷(수령 방법 · 반납 날 · 반납 시각 · 반납 장소):
     제목 줄 28 + 버튼 줄 52, 묶음 사이 8. 리프트권 권종 · 매수는 ① 품목에서만 고른다(여기서는 오른쪽 판에 읽기만). */
  .v3-step-no { font-size: calc(var(--sn-font-big) + var(--sn-space-xs)); font-weight: 700; line-height: 1; vertical-align: -0.08em; }

  .v3-body { display: flex; flex-direction: column; gap: var(--sn-space-s); padding-top: var(--sn-space-m); }
  .v3-block { display: flex; flex-direction: column; }
  .v3-block .mk-choices { height: var(--sn-target); }
  /* 고르기 버튼 폭: 줄마다 한 번에 눌리게 넉넉히. */
  .v3-wide .mk-choice { min-width: calc(var(--sn-target) * 2); }
  .v3-slots .mk-choice { min-width: calc(var(--sn-target) * 2); }
  .v3-place .mk-choice { min-width: calc(var(--sn-target) * 1.75); }
  /* 오늘 이미 지났거나 10분 안인 반납 타임(ui 6-3과 같은 기준): 자리는 그대로 두고(줄이 흔들리지 않게) 점선 · 회색, 누를 수 없음.
     '내일'을 고르면 다시 누를 수 있다. 늦음이 아니므로 빨강이 아니다. */
  .v3-slots .mk-choice:disabled { border-style: dashed; background: transparent; }

  /* 오른쪽 판: 제목 40 · 약속 4줄 208 · 안내 · 주 버튼 56 */
  .v3-rows { flex: none; }
  .v3-note { flex: none; padding: var(--sn-space-xs) var(--sn-space-xs) 0; }
  .v3-go { width: 100%; margin-top: auto; padding: 0 var(--sn-space-m); }
</style>
</head>
<body>
<div class="sn-root" data-device="pos" data-accent="orange">
  <div class="sn-screen">
    <header class="sn-header">
      <div class="sn-header-left">
        <button type="button" class="sn-header-home" aria-label="장부"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3"/><path d="M8 7h7M8 10.5h7"/></svg><span>장부</span></button>
        <span class="sn-fit sn-header-shop">우리 스키샵</span>
      </div>
      <div class="sn-header-right">
        <button type="button" class="sn-button sn-header-find" aria-label="끝 4자리"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="3" width="4" height="4" rx="1"/><rect x="10" y="3" width="4" height="4" rx="1"/><rect x="16" y="3" width="4" height="4" rx="1"/><rect x="4" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/><rect x="16" y="10" width="4" height="4" rx="1"/><rect x="10" y="17" width="4" height="4" rx="1"/></svg><span>끝 4자리</span></button>
        <button type="button" class="sn-button">수거 목록</button>
        <button type="button" class="sn-button">리프트권</button>
        <button type="button" class="sn-button">확인 필요</button>
        <button type="button" class="sn-icon-button" aria-label="알림 2건"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9"/><path d="M10.3 20.5a1.9 1.9 0 0 0 3.4 0"/></svg><span class="sn-badge">2</span></button>
        <button type="button" class="sn-button">관리</button>
        <button type="button" class="sn-button" aria-label="나가기"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span>나가기</span></button>
      </div>
    </header>

    <div class="sn-desk pos-slip-desk">
      <article class="sn-slip" aria-label="새 접수 · 약속">
        <header class="sn-slip-head">
          <h1 class="sn-slip-title">새 접수</h1>
          <div class="sn-tabs mk-head-tabs" role="tablist" aria-label="새 접수 단계">
            <button type="button" class="sn-tab" role="tab" aria-selected="false"><span class="v3-step-no">①</span> 품목</button>
            <button type="button" class="sn-tab" role="tab" aria-selected="true"><span class="v3-step-no">②</span> 약속</button>
            <button type="button" class="sn-tab" role="tab" aria-selected="false"><span class="v3-step-no">③</span> 확정</button>
          </div>
        </header>

        <div class="v3-body">
          <section class="v3-block v3-wide" aria-label="수령 방법">
            <h2 class="mk-title-line">수령 방법</h2>
            <div class="mk-choices">
              <button type="button" class="sn-button mk-choice" aria-pressed="true">매장 직접 · 지금</button>
              <button type="button" class="sn-button mk-choice" aria-pressed="false" aria-label="예약 · 누르면 수령일과 시각 고르기(전화 예약)">예약 · 수령일 <span class="mk-more">›</span></button>
              <button type="button" class="sn-button mk-choice" aria-pressed="false">차량 배달 <span class="mk-more">›</span></button>
            </div>
          </section>

          <section class="v3-block v3-wide" aria-label="반납 날">
            <h2 class="mk-title-line">반납 날</h2>
            <div class="mk-choices">
              <button type="button" class="sn-button mk-choice" aria-pressed="true">오늘</button>
              <button type="button" class="sn-button mk-choice" aria-pressed="false">내일</button>
              <button type="button" class="sn-button mk-choice" aria-pressed="false" aria-label="다른 날 · 누르면 날짜 고르기">다른 날 <span class="mk-more">›</span></button>
            </div>
          </section>

          <section class="v3-block v3-slots" aria-label="반납 시각">
            <h2 class="mk-title-line">반납 시각</h2>
            <div class="mk-choices">
              <button type="button" class="sn-button mk-choice" aria-pressed="false" disabled aria-label="오전타임 후 12:00 · 오늘은 지나서 고를 수 없음">오전타임 후 12:00</button>
              <button type="button" class="sn-button mk-choice" aria-pressed="false" disabled aria-label="오후 16:30 · 10분 안이라 고를 수 없음">오후 16:30</button>
              <button type="button" class="sn-button mk-choice" aria-pressed="true">야간 22:00</button>
              <button type="button" class="sn-button mk-choice" aria-pressed="false">심야 24:00</button>
            </div>
          </section>

          <section class="v3-block v3-place" aria-label="반납 장소">
            <h2 class="mk-title-line">반납 장소</h2>
            <div class="mk-choices">
              <button type="button" class="sn-button mk-choice" aria-pressed="true">매장 직접</button>
              <button type="button" class="sn-button mk-choice" aria-pressed="false">설천 <span class="mk-more">›</span></button>
              <button type="button" class="sn-button mk-choice" aria-pressed="false">만선 <span class="mk-more">›</span></button>
              <button type="button" class="sn-button mk-choice" aria-pressed="false">솔마을 <span class="mk-more">›</span></button>
              <button type="button" class="sn-button mk-choice" aria-pressed="false">꽃마을 <span class="mk-more">›</span></button>
            </div>
          </section>
        </div>
      </article>

      <aside class="pos-side" aria-label="접수 내용">
        <div class="mk-panel-title"><span>접수 내용</span></div>
        <ol class="mk-list v3-rows">
          <li class="mk-list-row"><span class="mk-list-main"><b>수령 · 지금 16:25</b><small>매장 직접</small></span></li>
          <li class="mk-list-row"><span class="mk-list-main"><b>반납 · 오늘 22:00</b><small>매장 직접 · 손님이 가져옴</small></span></li>
          <li class="mk-list-row"><span class="mk-list-main"><b>장비 225,000원</b><small>스키 4 · 의류 3 · 헬멧 1</small></span></li>
          <li class="mk-list-row"><span class="mk-list-main"><b>리프트권 140,000원</b><small>야간권 4매 · 보증금 20,000원 따로</small></span></li>
        </ol>
        <p class="mk-note v3-note">품목마다 다른 약속은 접수 뒤 접수증의 약속 바꾸기에서 합니다.</p>
        <button type="button" class="sn-primary v3-go" data-primary="true">다음 · 받을 돈 정하기</button>
      </aside>
    </div>

    <footer class="sn-footer">
      <div class="sn-footer-metrics">
        <div class="pos-footer-back">
          <button type="button" class="sn-button"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m15 6-6 6 6 6"/></svg><span>장부</span></button>
          <span class="sn-fit">새 접수 · 이민호 팀 · 4명</span>
        </div>
      </div>
    </footer>
  </div>
</div>
</body>
</html>
