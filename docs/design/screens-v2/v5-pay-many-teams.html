<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일괄 수납 · 여러 팀 · 둘째 판 시안 V5</title>
<link rel="stylesheet" href="base.css">
<style>
  /* V5 일괄 수납 · 여러 팀(spec.md 3-6). 틀은 2-1 가, 단 왼쪽은 접수증 테두리가 없는 장부 종이(sn-sheet).
     표: 제목 · 탭 60 · 표 머리 40 · 줄 52 × 6. 칸 폭(글 폭 668): 선택 56 · 팀 150 · 품목 나머지(186) · 받을 금액 112 · 부분 결제 164.
     부분 결제 칸이 넓은 까닭: 품목을 고른 뒤의 글 '부분 · 165,000원 ›'(가장 긴 경우)이 버튼 얼굴(148)에 들어가야 한다(#part). */
  .v5-table { width: 100%; }
  .v5-table col.is-check { width: calc(var(--sn-target) + var(--sn-space-xs)); }
  .v5-table col.is-team { width: calc(var(--sn-target) * 3 - var(--sn-space-s) * 0.75); }
  .v5-table col.is-due { width: calc(var(--sn-target) * 2 + var(--sn-space-s)); }
  .v5-table col.is-pay { width: calc(var(--sn-target) * 3 + var(--sn-space-s)); }
  .v5-table .sn-row > td { font-size: var(--sn-font-body); font-weight: 700; }
  .v5-table th.align-center { text-align: center; }

  /* 선택 칸: 칸 전체(56 × 52)가 누르는 곳, 28px 네모 안에 체크(남색 바탕 · 크림 체크). */
  .v5-check {
    display: grid; place-items: center; width: 100%; height: var(--sn-row-h); min-height: var(--sn-target);
    cursor: pointer;
  }
  .v5-box {
    display: grid; place-items: center;
    width: calc(var(--sn-font-title) + var(--sn-space-xs)); height: calc(var(--sn-font-title) + var(--sn-space-xs));
    border: var(--sn-line-strong) solid var(--sn-ink); border-radius: var(--sn-radius-s); background: var(--sn-paper);
    font-size: var(--sn-font-body);
  }
  .v5-check[aria-checked='true'] .v5-box { background: var(--sn-ink); color: var(--sn-paper); }
  .v5-check[aria-checked='true'] .v5-box .sn-icon { stroke-width: 3; }

  /* 팀 칸: 굵은 '이름 · 끝 4자리' / 작은 이름표 */
  .v5-team { gap: calc(var(--sn-space-xs) / 2); }
  .v5-team > b { font-size: var(--sn-font-body); font-weight: 900; white-space: nowrap; }
  .v5-due { font-weight: 900; white-space: nowrap; }

  /* 부분 결제 칸: 칸 전체가 누르는 곳, 보이는 버튼 모양은 줄 선 안쪽(줄 높이 52에 테두리가 붙지 않게).
     버튼은 누르면 일어나는 일('부분 결제 ›' = 이 팀 품목 중 일부만 선택)을 쓴다. 전부는 받을 금액 칸의 금액 그대로라 따로 쓰지 않는다.
     품목을 고른 뒤에는 '부분 · 165,000원 ›'(다시 누르면 고친다). */
  .v5-part {
    display: grid; place-items: center; width: 100%; height: var(--sn-row-h); min-height: var(--sn-target);
    padding: 0 var(--sn-space-s); border: 0; background: transparent;
  }
  .v5-part-face {
    display: inline-flex; align-items: center; justify-content: center; width: 100%;
    height: calc(var(--sn-target) - var(--sn-space-m)); border: var(--sn-line-strong) solid var(--sn-ink); border-radius: var(--sn-radius-s);
    font-size: var(--sn-font-body); font-weight: 800; white-space: nowrap;
  }

  /* 오른쪽 판: 제목 40 · 금액 64 · 수단 제목 28 · 수단 2×2 112 · 빈칸 · 주 버튼 56(안내 글 없음: 버튼이 스스로 말한다) */
  .v5-money { display: flex; flex-direction: column; justify-content: center; gap: var(--sn-space-xs); flex: none; min-height: calc(var(--sn-target) + var(--sn-space-m)); padding: 0 var(--sn-space-xs); }
  .v5-money > span { font-size: var(--sn-font-body); font-weight: 800; color: var(--sn-ink-soft); white-space: nowrap; }
  .v5-methods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sn-space-s); flex: none; }
  .v5-methods .pos-method { min-width: 0; padding: 0 var(--sn-space-s); }
  .v5-side .mk-title-line { padding: 0 var(--sn-space-xs); }
  /* 상태: 주소 #part면 이민호 팀이 품목 일부만 고른 상태(스크립트가 data-state를 넣는다). */
  .sn-root:not([data-state='part']) [data-show='part'],
  .sn-root[data-state='part'] [data-show='all'] { display: none; }
  .v5-go { width: 100%; margin-top: auto; padding: 0 var(--sn-space-m); }

  /* 바닥줄: '‹ 접수증'과 '팀 추가 · 끝 4자리' */
  .v5-foot { display: flex; align-items: center; gap: var(--sn-space-m); }
</style>
</head>
<body>
<div class="sn-root" data-device="pos" data-accent="orange">
  <div class="sn-screen">
    <header class="sn-header">
      <div class="sn-header-left">
        <button type="button" class="sn-header-home" aria-label="장부"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3"/><path d="M8 7h7M8 10.5h7"/></svg><span>장부</span></button>
        <span class="sn-fit sn-header-shop">우리 스키샵</span>
      </div>
      <div class="sn-header-right">
        <button type="button" class="sn-button sn-header-find" aria-label="끝 4자리"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="3" width="4" height="4" rx="1"/><rect x="10" y="3" width="4" height="4" rx="1"/><rect x="16" y="3" width="4" height="4" rx="1"/><rect x="4" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/><rect x="16" y="10" width="4" height="4" rx="1"/><rect x="10" y="17" width="4" height="4" rx="1"/></svg><span>끝 4자리</span></button>
        <button type="button" class="sn-button">수거 목록</button>
        <button type="button" class="sn-button">리프트권</button>
        <button type="button" class="sn-button">확인 필요</button>
        <button type="button" class="sn-icon-button" aria-label="알림 2건"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9"/><path d="M10.3 20.5a1.9 1.9 0 0 0 3.4 0"/></svg><span class="sn-badge">2</span></button>
        <button type="button" class="sn-button">관리</button>
        <button type="button" class="sn-button" aria-label="나가기"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span>나가기</span></button>
      </div>
    </header>

    <div class="sn-desk pos-slip-desk">
      <main class="sn-sheet" aria-label="일괄 수납">
        <div class="sn-titlebar">
          <h1 class="sn-title">일괄 수납</h1>
          <div class="sn-tabs" role="tablist" aria-label="선택 팀">
            <button type="button" class="sn-tab" role="tab" aria-selected="true">이정호 팀 결제 · 6팀</button>
            <button type="button" class="sn-tab" role="tab" aria-selected="false">미수 3</button>
          </div>
        </div>
        <table class="sn-ledger-table v5-table">
          <colgroup><col class="is-check"><col class="is-team"><col class="is-items"><col class="is-due"><col class="is-pay"></colgroup>
          <thead>
            <tr><th scope="col" class="align-center">선택</th><th scope="col">팀</th><th scope="col">품목</th><th scope="col" class="align-end">받을 금액</th><th scope="col" class="align-center" aria-label="부분 결제 품목 선택"></th></tr>
          </thead>
          <tbody>
            <tr class="sn-row">
              <td class="is-action"><div class="v5-check" role="checkbox" aria-checked="true" aria-label="이정호 · 0032 선택"><span class="v5-box"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></div></td>
              <td><span class="sn-cell-stack v5-team"><b>이정호 · 0032</b><span class="mk-tag">결제 팀</span></span></td>
              <td>스키 2 · 헬멧 2</td>
              <td class="align-end"><span class="v5-due">90,000원</span></td>
              <td class="is-action"><button type="button" class="v5-part" aria-label="이정호 · 0032 · 부분 결제 · 품목 선택"><span class="v5-part-face">부분 결제 ›</span></button></td>
            </tr>
            <tr class="sn-row">
              <td class="is-action"><div class="v5-check" role="checkbox" aria-checked="true" aria-label="이서연 · 0036 선택"><span class="v5-box"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></div></td>
              <td><span class="sn-cell-stack v5-team"><b>이서연 · 0036</b><span class="mk-tag is-blue">결제 예정</span></span></td>
              <td>스키 1 · 의류 1</td>
              <td class="align-end"><span class="v5-due">60,000원</span></td>
              <td class="is-action"><button type="button" class="v5-part" aria-label="이서연 · 0036 · 부분 결제 · 품목 선택"><span class="v5-part-face">부분 결제 ›</span></button></td>
            </tr>
            <tr class="sn-row">
              <td class="is-action"><div class="v5-check" role="checkbox" aria-checked="true" aria-label="이민호 · 0042 선택"><span class="v5-box"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></div></td>
              <td><span class="sn-cell-stack v5-team"><b>이민호 · 0042</b><span class="mk-tag is-blue">결제 예정</span></span></td>
              <td>스키 4 · 의류 3 · 헬멧 1</td>
              <td class="align-end"><span class="v5-due">225,000원</span></td>
              <td class="is-action"><button type="button" class="v5-part" data-show="all" aria-label="이민호 · 0042 · 부분 결제 · 품목 선택"><span class="v5-part-face">부분 결제 ›</span></button><button type="button" class="v5-part" data-show="part" aria-label="이민호 · 0042 · 부분 165,000원 · 스키 4 · 헬멧 1 · 품목 다시 선택"><span class="v5-part-face">부분 · 165,000원 ›</span></button></td>
            </tr>
            <tr class="sn-row">
              <td class="is-action"><div class="v5-check" role="checkbox" aria-checked="true" aria-label="강지은 · 0043 선택"><span class="v5-box"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></div></td>
              <td><span class="sn-cell-stack v5-team"><b>강지은 · 0043</b><span class="mk-tag is-blue">결제 예정</span></span></td>
              <td>보드 1 · 의류 1</td>
              <td class="align-end"><span class="v5-due">45,000원</span></td>
              <td class="is-action"><button type="button" class="v5-part" aria-label="강지은 · 0043 · 부분 결제 · 품목 선택"><span class="v5-part-face">부분 결제 ›</span></button></td>
            </tr>
            <tr class="sn-row">
              <td class="is-action"><div class="v5-check" role="checkbox" aria-checked="true" aria-label="이준서 · 0044 선택"><span class="v5-box"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></div></td>
              <td><span class="sn-cell-stack v5-team"><b>이준서 · 0044</b><span class="mk-tag is-blue">결제 예정</span></span></td>
              <td>스키 1</td>
              <td class="align-end"><span class="v5-due">40,000원</span></td>
              <td class="is-action"><button type="button" class="v5-part" aria-label="이준서 · 0044 · 부분 결제 · 품목 선택"><span class="v5-part-face">부분 결제 ›</span></button></td>
            </tr>
            <tr class="sn-row">
              <td class="is-action"><div class="v5-check" role="checkbox" aria-checked="true" aria-label="송하윤 · 0045 선택"><span class="v5-box"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></div></td>
              <td><span class="sn-cell-stack v5-team"><b>송하윤 · 0045</b><span class="mk-tag is-blue">결제 예정</span></span></td>
              <td>보드 1</td>
              <td class="align-end"><span class="v5-due">25,000원</span></td>
              <td class="is-action"><button type="button" class="v5-part" aria-label="송하윤 · 0045 · 부분 결제 · 품목 선택"><span class="v5-part-face">부분 결제 ›</span></button></td>
            </tr>
          </tbody>
        </table>
      </main>

      <aside class="pos-side v5-side" aria-label="받을 금액">
        <div class="mk-panel-title"><span>받을 금액</span></div>
        <div class="v5-money">
          <b class="mk-big-money" data-show="all">485,000원</b>
          <b class="mk-big-money" data-show="part">425,000원</b>
          <span>6팀 · 이정호 팀 결제</span>
        </div>
        <h2 class="mk-title-line">결제 수단</h2>
        <div class="v5-methods" role="group" aria-label="결제 수단">
          <button type="button" class="sn-button pos-method" aria-pressed="true">카드</button>
          <button type="button" class="sn-button pos-method" aria-pressed="false">현금</button>
          <button type="button" class="sn-button pos-method" aria-pressed="false">계좌이체</button>
          <button type="button" class="sn-button pos-method" aria-pressed="false">기타</button>
        </div>
        <button type="button" class="sn-primary v5-go" data-primary="true" data-show="all">수납 처리 · 6팀 · 485,000원</button>
        <button type="button" class="sn-primary v5-go" data-primary="true" data-show="part">수납 처리 · 6팀 · 425,000원</button>
      </aside>
    </div>

    <footer class="sn-footer">
      <div class="sn-footer-metrics v5-foot">
        <button type="button" class="sn-button"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m15 6-6 6 6 6"/></svg><span>접수증</span></button>
        <button type="button" class="sn-button"><svg class="sn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="3" width="4" height="4" rx="1"/><rect x="10" y="3" width="4" height="4" rx="1"/><rect x="16" y="3" width="4" height="4" rx="1"/><rect x="4" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/><rect x="16" y="10" width="4" height="4" rx="1"/><rect x="10" y="17" width="4" height="4" rx="1"/></svg><span>팀 추가 · 끝 4자리</span></button>
      </div>
    </footer>
  </div>
</div>
<script>
  // 상태 변형: #part = 이민호 팀이 스키 4 · 헬멧 1만 선택(의류 3은 이민호 팀 미수로 남김, spec.md 3-6 상태).
  (function () {
    if (location.hash === '#part') document.querySelector('.sn-root').setAttribute('data-state', 'part');
  })();
</script>
</body>
</html>
